<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" role="img" aria-labelledby="title desc">
<title id="title">DFD konteks · layanan Smart Street Lamp</title><desc id="desc">Notasi Gane–Sarson. Batas sistem: dashboard, API dan penyimpanan. ESP32 mengambil keputusan otomatis lokal.</desc>
<rect width="1280" height="670" fill="#ffffff"/>
