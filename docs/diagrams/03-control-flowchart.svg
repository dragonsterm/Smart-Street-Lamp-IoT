<text x="48" y="53" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="600" fill="#14213d" text-anchor="start"><tspan x="48" dy="0">Flowchart · keputusan tiga lampu</tspan></text>
<text x="48" y="86" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#617086" text-anchor="start"><tspan x="48" dy="0">Notasi flowchart: terminal, proses dan keputusan. Semua cabang otomatis memakai tiga PWM bersama.</tspan></text>
