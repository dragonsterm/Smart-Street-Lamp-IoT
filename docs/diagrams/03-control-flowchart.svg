<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1510" viewBox="0 0 1280 1510" role="img" aria-labelledby="title desc">
<title id="title">Flowchart · keputusan tiga lampu</title><desc id="desc">Notasi flowchart: terminal, proses dan keputusan. Semua cabang otomatis memakai tiga PWM bersama.</desc>
