<rect x="48" y="1400" width="1184" height="78" rx="8" fill="#f6f4ed" stroke="#d6dbe3"/>
<text x="66" y="1428" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#617086" text-anchor="start"><tspan x="66" dy="0">Satu HC-SR04 di pintu masuk: hadir pada jarak ≤150 cm, keluar pada ≥180 cm, tahan terang 5 detik.</tspan><tspan x="66" dy="22.4">Terang mematikan lampu otomatis; manual mengikuti PWM pengguna. Tanpa kontak server 30 detik → otomatis adaptif.</tspan></text>
<text x="48" y="1485" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#617086" text-anchor="start"><tspan x="48" dy="0">SMART STREET LAMP  /  ESP32 · FastAPI · MySQL (XAMPP/MariaDB)  /  05 NOV 2026</tspan></text>
