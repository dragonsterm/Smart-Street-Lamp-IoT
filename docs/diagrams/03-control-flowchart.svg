<text x="1030.0" y="457" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#617086" text-anchor="middle"><tspan x="1030.0" dy="0">Terapkan 0–100% per kanal</tspan></text>
