<text x="83" y="938" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#617086" text-anchor="start"><tspan x="83" dy="0">Nilai waktu memakai Unix epoch milidetik. boots.last_seq menolak data lama; sequence per boot mencegah duplikasi.</tspan><tspan x="83" dy="22.4">commands: queued → delivered → applied / failed; atau expired / superseded. INDEX(device_id, issued_at_ms).</tspan><tspan x="83" dy="22.4">telemetry.payload: ldr_raw, light_percent, light_condition, distance_cm[1], pwm[3], INA virtual, environment, ack_id.</tspan><tspan x="83" dy="22.4">Akun admin berada di konfigurasi lokal; sesi browser adalah cookie bertanda tangan. Tidak ada tabel users yang tidak dipakai.</tspan></text>
<text x="48" y="1095" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#617086" text-anchor="start"><tspan x="48" dy="0">SMART STREET LAMP  /  ESP32 · FastAPI · MySQL (XAMPP/MariaDB)  /  05 NOV 2026</tspan></text>
</svg>
