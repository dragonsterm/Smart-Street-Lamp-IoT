<text x="755" y="722" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#14213d" text-anchor="start"><tspan x="755" dy="0">UNIQUE(device_id, boot_id, seq)</tspan></text>
