<text x="520.0" y="317" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#617086" text-anchor="middle"><tspan x="520.0" dy="0">≤30% → gelap; ≥45% → terang</tspan><tspan x="520.0" dy="21.0">30–45% → pertahankan keadaan</tspan></text>
